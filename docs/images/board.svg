  <rect x="420" y="60" width="10" height="10" fill="#c9a46a"/>
  <rect x="420" y="76" width="10" height="10" fill="#c9a46a"/>
  <rect x="438" y="60" width="10" height="10" fill="#c9a46a"/>
  <rect x="438" y="76" width="10" height="10" fill="#c9a46a"/>
  <rect x="456" y="60" width="10" height="10" fill="#c9a46a"/>
  <rect x="456" y="76" width="10" height="10" fill="#c9a46a"/>
  <rect x="474" y="60" width="10" height="10" fill="#c9a46a"/>
  <rect x="474" y="76" width="10" height="10" fill="#c9a46a"/>
  <rect x="492" y="60" width="10" height="10" fill="#c9a46a"/>
  <rect x="492" y="76" width="10" height="10" fill="#c9a46a"/>
  <rect x="510" y="60" width="10" height="10" fill="#c9a46a"/>
  <rect x="510" y="76" width="10" height="10" fill="#c9a46a"/>
  <rect x="528" y="60" width="10" height="10" fill="#c9a46a"/>
  <rect x="528" y="76" width="10" height="10" fill="#c9a46a"/>
  <rect x="546" y="60" width="10" height="10" fill="#c9a46a"/>
  <rect x="546" y="76" width="10" height="10" fill="#c9a46a"/>
  <rect x="564" y="60" width="10" height="10" fill="#c9a46a"/>
  <rect x="564" y="76" width="10" height="10" fill="#c9a46a"/>
  <rect class="chip" x="300" y="120" width="150" height="170" rx="6"/>
  <text class="t3" x="375" y="205" text-anchor="middle" style="fill:#17222c">ESP32-P4</text>
  <rect class="chip" x="320" y="305" width="100" height="95" rx="5"/>
  <text class="t3" x="370" y="350" text-anchor="middle" style="fill:#17222c">ESP32-C6</text>
  <circle cx="412" cy="392" r="6" fill="#c9a46a" stroke="#8e979f"/>
  <rect x="230" y="120" width="22" height="160" rx="3" fill="#0a2c32" stroke="var(--silk)" stroke-opacity="0.3"/>
  <rect x="262" y="120" width="22" height="160" rx="3" fill="#0a2c32" stroke="var(--silk)" stroke-opacity="0.3"/>
  <rect x="214" y="400" width="22" height="22" rx="4" fill="#2b3742"/><rect x="214" y="440" width="22" height="22" rx="4" fill="#2b3742"/>
  <text class="silk" x="214" y="434">RST</text><text class="silk" x="214" y="474">BOOT</text>
  <rect x="250" y="410" width="86" height="100" rx="4" fill="#b8bfc5" stroke="#7d868d"/>
  <text class="t3" x="293" y="455" text-anchor="middle" style="fill:#17222c">USB-A</text><text class="t3" x="293" y="473" text-anchor="middle" style="fill:#17222c">USB-C</text>
  <rect x="350" y="420" width="110" height="90" rx="4" fill="#b8bfc5" stroke="#7d868d"/>
  <text class="t3" x="405" y="470" text-anchor="middle" style="fill:#17222c">RJ45</text>
  <rect x="480" y="420" width="80" height="70" rx="4" fill="#b8bfc5" stroke="#7d868d"/>
  <text class="t3" x="520" y="460" text-anchor="middle" style="fill:#17222c">TF card</text>
  <circle cx="578" cy="428" r="6" fill="#c9a46a" stroke="#0a2c32" stroke-width="2"/>
  <circle cx="578" cy="446" r="6" fill="#c9a46a" stroke="#0a2c32" stroke-width="2"/>
  <circle cx="578" cy="464" r="6" fill="#c9a46a" stroke="#0a2c32" stroke-width="2"/>
  <circle cx="578" cy="482" r="6" fill="#c9a46a" stroke="#0a2c32" stroke-width="2"/>
  <text class="silk" x="560" y="418">H7</text>
  <path class="lead" d="M214 74 L196 69"/>
  <circle cx="214" cy="74" r="3" fill="var(--quiet)"/>
  <text class="t3" x="190" y="74" text-anchor="end">40-pin header</text>
  <text class="t2" x="190" y="91" text-anchor="end">maintenance jumper: pins 12, 16, 18</text>
  <path class="lead" d="M412 392 L634 295"/>
  <circle cx="412" cy="392" r="3" fill="var(--quiet)"/>
  <text class="t3" x="640" y="300" text-anchor="start">C6 antenna connector (IPEX)</text>
  <text class="t2" x="640" y="317" text-anchor="start">fit a 2.4 GHz antenna here</text>
  <path class="lead" d="M370 340 L634 225"/>
  <circle cx="370" cy="340" r="3" fill="var(--quiet)"/>
  <text class="t3" x="640" y="230" text-anchor="start">ESP32-C6: the built-in radio</text>
  <text class="t2" x="640" y="247" text-anchor="start">Thread or Zigbee</text>
  <path class="lead" d="M375 160 L634 135"/>
  <circle cx="375" cy="160" r="3" fill="var(--quiet)"/>
  <text class="t3" x="640" y="140" text-anchor="start">ESP32-P4: runs the firmware</text>
  <text class="t2" x="640" y="157" text-anchor="start">border router, web UI</text>
  <path class="lead" d="M584 455 L634 425"/>
  <circle cx="584" cy="455" r="3" fill="var(--quiet)"/>
  <text class="t3" x="640" y="430" text-anchor="start">H7: C6 UART pads</text>
  <text class="t2" x="640" y="447" text-anchor="start">TXD, RXD, GND, IO9 (pin 1 at top)</text>
  <path class="lead" d="M405 510 L634 515"/>
  <circle cx="405" cy="510" r="3" fill="var(--quiet)"/>
  <text class="t3" x="640" y="520" text-anchor="start">Ethernet (RJ45), PoE</text>
  <text class="t2" x="640" y="537" text-anchor="start">network and power</text>
  <path class="lead" d="M293 510 L196 540"/>
  <circle cx="293" cy="510" r="3" fill="var(--quiet)"/>
  <text class="t3" x="190" y="545" text-anchor="end">USB-A above USB-C</text>
  <text class="t2" x="190" y="562" text-anchor="end">A: USB radio dongle · C: flashing, console</text>
  <path class="lead" d="M214 450 L196 415"/>
  <circle cx="214" cy="450" r="3" fill="var(--quiet)"/>
  <text class="t3" x="190" y="420" text-anchor="end">RESET and BOOT</text>
  <text class="t2" x="190" y="437" text-anchor="end">hold BOOT, press RESET: download mode</text>
  </g>
</svg>
