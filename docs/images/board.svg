  <rect x="330" y="76" width="10" height="10" fill="#c9a46a"/>
  <rect x="348" y="60" width="10" height="10" fill="#c9a46a"/>
  <rect x="348" y="76" width="10" height="10" fill="#c9a46a"/>
  <rect x="366" y="60" width="10" height="10" fill="#c9a46a"/>
  <rect x="366" y="76" width="10" height="10" fill="#c9a46a"/>
