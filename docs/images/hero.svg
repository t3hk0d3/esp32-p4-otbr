<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img"
     aria-label="Thread devices talk over an 802.15.4 mesh to the ESP32-C6 radio on the board; the ESP32-P4 border router bridges them over Ethernet and PoE to Home Assistant, the web UI and the internet">
  <style>
    :root {
      --bg: #f7f8fa; --card: #ffffff; --line: #d9dde3; --text: #1f2328; --muted: #656d76;
      --thread: #12a594; --thread-soft: #d7f2ee; --accent: #f08c00; --accent-soft: #fff1dc;
      --net: #3b6fd8; --net-soft: #e2ebfb; --pcb: #1d4a3a; --pcb-edge: #143528; --chip: #2b2f36; --chip-text: #f2f4f7; --antenna: #2b2f36;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --card: #161b22; --line: #30363d; --text: #e6edf3; --muted: #8d96a0;
        --thread: #2fc9b4; --thread-soft: #10302c; --accent: #ffa733; --accent-soft: #3a2a12;
        --net: #6b9bff; --net-soft: #152544; --pcb: #1f5240; --pcb-edge: #3b7a63; --chip: #0d1117; --chip-text: #e6edf3; --antenna: #8d96a0;
      }
    }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
    .muted { fill: var(--muted); }
    .zone { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; fill: var(--muted); }
    .title { font-size: 16px; font-weight: 700; }
    .sub { font-size: 13px; fill: var(--muted); }
    .chip-name { font-size: 15px; font-weight: 700; fill: var(--chip-text); }
    .chip-sub { font-size: 12px; fill: var(--chip-text); opacity: 0.75; }
    .pill { font-size: 13px; font-weight: 600; }
    .mesh { stroke: var(--thread); stroke-width: 2; stroke-dasharray: 5 5; fill: none; opacity: 0.7; }
    .node { fill: var(--card); stroke: var(--thread); stroke-width: 2.5; }
    .glyph { fill: none; stroke: var(--thread); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .wave { fill: none; stroke: var(--thread); stroke-width: 2.5; stroke-linecap: round; }
    .cable { fill: none; stroke: var(--net); stroke-width: 4; stroke-linecap: round; }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .icon { fill: none; stroke: var(--net); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1200" height="480" rx="24" fill="var(--bg)"/>

  <!-- Thread mesh -->
  <text class="zone" x="200" y="56" text-anchor="middle">THREAD MESH</text>
  <path class="mesh" d="M110 150 L230 120 L320 205 L200 255 L110 150 M200 255 L95 330 L215 370 L320 205 M230 120 L200 255 M215 370 L200 255"/>
  <g transform="translate(110 150)"><circle class="node" r="26"/>
    <path class="glyph" d="M0 -11 a8 8 0 0 1 5 14 v4 h-10 v-4 a8 8 0 0 1 5 -14 M-4 11 h8"/></g>
  <g transform="translate(230 120)"><circle class="node" r="26"/>
    <path class="glyph" d="M-2 -12 a3 3 0 0 1 4 0 v13 a6 6 0 1 1 -4 0 z M0 4 v-8"/></g>
  <g transform="translate(320 205)"><circle class="node" r="26"/>
    <path class="glyph" d="M-8 -1 h16 v12 h-16 z M-5 -1 v-5 a5 5 0 0 1 10 0 v5 M0 4 v3"/></g>
  <g transform="translate(200 255)"><circle class="node" r="26"/>
    <path class="glyph" d="M-9 -9 h18 v18 h-18 z M-9 -3 h18 M-9 3 h18"/></g>
  <g transform="translate(95 330)"><circle class="node" r="26"/>
    <path class="glyph" d="M-4 -11 v6 M4 -11 v6 M-8 -5 h16 v5 a8 8 0 0 1 -16 0 z M0 8 v4"/></g>
  <g transform="translate(215 370)"><circle class="node" r="26"/>
    <path class="glyph" d="M-10 2 a12 12 0 0 1 20 0 M-6 6 a7 7 0 0 1 12 0 M0 10 v0.5"/></g>
  <text class="title" x="200" y="425" text-anchor="middle">Lights, sensors, locks, plugs</text>
  <text class="sub" x="200" y="447" text-anchor="middle">IEEE 802.15.4 · Matter over Thread</text>

  <!-- radio waves from the antenna toward the mesh -->
  <path class="wave" d="M452 78 a22 22 0 0 0 0 34" opacity="0.9"/>
  <path class="wave" d="M438 66 a40 40 0 0 0 0 58" opacity="0.6"/>
  <path class="wave" d="M424 54 a58 58 0 0 0 0 82" opacity="0.35"/>

  <!-- the board -->
  <text class="zone" x="625" y="56" text-anchor="middle">ONE POE BOARD</text>
  <rect x="470" y="70" width="12" height="70" rx="3" fill="var(--antenna)"/>
  <circle cx="476" cy="70" r="7" fill="var(--antenna)"/>
  <rect x="440" y="130" width="370" height="230" rx="18" fill="var(--pcb)" stroke="var(--pcb-edge)" stroke-width="2"/>
  <g fill="var(--pcb-edge)">
    <circle cx="460" cy="150" r="7"/><circle cx="790" cy="150" r="7"/><circle cx="460" cy="340" r="7"/><circle cx="790" cy="340" r="7"/>
  </g>
  <g fill="#c9a227" opacity="0.8">
    <circle cx="560" cy="342" r="3"/><circle cx="574" cy="342" r="3"/><circle cx="588" cy="342" r="3"/><circle cx="602" cy="342" r="3"/>
    <circle cx="616" cy="342" r="3"/><circle cx="630" cy="342" r="3"/><circle cx="644" cy="342" r="3"/><circle cx="658" cy="342" r="3"/>
    <circle cx="672" cy="342" r="3"/><circle cx="686" cy="342" r="3"/>
  </g>
  <!-- C6 -->
  <rect x="468" y="190" width="120" height="108" rx="10" fill="var(--chip)" stroke="var(--thread)" stroke-width="2.5"/>
  <text class="chip-name" x="528" y="236" text-anchor="middle">ESP32-C6</text>
  <text class="chip-sub" x="528" y="256" text-anchor="middle">802.15.4 radio</text>
  <text class="chip-sub" x="528" y="273" text-anchor="middle">(RCP)</text>
  <path d="M476 140 v50" stroke="var(--antenna)" stroke-width="4"/>
  <!-- SPI link -->
  <path d="M588 244 h46" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>
  <text x="611" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent)">SPI</text>
  <!-- P4 -->
  <rect x="634" y="176" width="138" height="136" rx="12" fill="var(--chip)" stroke="var(--accent)" stroke-width="2.5"/>
  <text class="chip-name" x="703" y="234" text-anchor="middle">ESP32-P4</text>
  <text class="chip-sub" x="703" y="254" text-anchor="middle">OpenThread</text>
  <text class="chip-sub" x="703" y="271" text-anchor="middle">border router</text>
  <!-- RJ45 -->
  <rect x="796" y="218" width="34" height="52" rx="4" fill="#b8c0c8" stroke="#8a939c" stroke-width="2"/>
  <rect x="804" y="232" width="18" height="24" rx="2" fill="#5b636b"/>
  <text class="title" x="625" y="398" text-anchor="middle">Waveshare ESP32-P4-WIFI6-POE-ETH</text>
  <text class="sub" x="625" y="420" text-anchor="middle">no Raspberry Pi, no USB dongle, no Wi-Fi</text>

  <!-- Ethernet to the network -->
  <text class="zone" x="1045" y="56" text-anchor="middle">YOUR NETWORK</text>
  <path class="cable" d="M830 244 H880 C895 244 900 238 900 225 V150 C900 140 905 135 915 135 H930 M900 244 H930 M900 225 V340 C900 350 905 355 915 355 H930"/>
  <text x="866" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="var(--net)">Ethernet</text>
  <text x="866" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="var(--net)">+ PoE</text>

  <rect class="card" x="930" y="100" width="248" height="70" rx="14"/>
  <path class="icon" d="M954 141 l14 -12 l14 12 M958 138 v14 h20 v-14"/>
  <text class="title" x="996" y="131">Home Assistant</text>
  <text class="sub" x="996" y="151">Thread REST API</text>

  <rect class="card" x="930" y="209" width="248" height="70" rx="14"/>
  <path class="icon" d="M952 232 h32 v24 h-32 z M952 239 h32 M956 235.5 h0.5 M960 235.5 h0.5"/>
  <text class="title" x="996" y="240">Web UI</text>
  <text class="sub" x="996" y="260">status · updates · sniffer</text>

  <rect class="card" x="930" y="320" width="248" height="70" rx="14"/>
  <path class="icon" d="M968 343 a12 12 0 1 0 0.01 0 M956 355 h24 M968 343 c-6 6 -6 18 0 24 c6 -6 6 -18 0 -24"/>
  <text class="title" x="996" y="351">Internet</text>
  <text class="sub" x="996" y="371">IPv6 · NAT64 · DHCPv6-PD</text>
</svg>
