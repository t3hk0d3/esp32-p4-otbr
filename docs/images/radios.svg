<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 392" width="1120" height="392" role="img"
     aria-label="The built-in ESP32-C6 and a USB radio dongle connect to the ESP32-P4, which runs each radio as Thread, Zigbee, an RCP proxy or off. Thread serves Home Assistant and Matter controllers; the on-board Zigbee coordinator serves ZHA, and Zigbee2MQTT reaches a dongle through the proxy. Thread and Zigbee run one at a time; a proxy runs beside either.">
  <!-- Generated for the documentation. Teal is radio (Thread), yellow Zigbee, copper wire. -->
  <style>
    :root { --bg: #eef2f4; --box: #ffffff; --line: #c3ced6; --ink: #17222c; --quiet: #5d6b77;
            --air: #12968f; --zig: #a8850f; --wire: #b8732e; --pcb: #0e3b43; --silk: #e9e4d4; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1a24; --box: #16242f; --line: #2d3d4a; --ink: #e7ecef; --quiet: #91a0ab;
              --air: #3cc7bb; --zig: #e6c84f; --wire: #d9944a; --pcb: #0b2c33; --silk: #e9e4d4; }
    }
    text { font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
    .t1 { font-size: 16px; font-weight: 650; }
    .t2 { font-size: 13px; fill: var(--quiet); }
    .t3 { font-size: 12.5px; font-weight: 600; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .silk { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: var(--silk); }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.5; }
    .box.b-air { stroke: var(--air); } .box.b-zig { stroke: var(--zig); } .box.b-wire { stroke: var(--wire); }
    .pcb { fill: var(--pcb); stroke: var(--air); stroke-width: 1.5; }
    .chip { fill: #c9ced2; stroke: #8e979f; stroke-width: 1; }
    .wire { fill: none; stroke: var(--wire); stroke-width: 3; stroke-linecap: round; }
    .wire.thin { stroke-width: 2; }
    .air { fill: none; stroke: var(--air); stroke-width: 1.8; stroke-dasharray: 5 6; stroke-linecap: round; }
    .airs { fill: none; stroke: var(--air); stroke-width: 1.8; stroke-linecap: round; }
    .zigl { fill: none; stroke: var(--zig); stroke-width: 1.8; stroke-dasharray: 5 6; stroke-linecap: round; }
    .lead { fill: none; stroke: var(--quiet); stroke-width: 1; }
    .arrow { fill: none; stroke: var(--ink); stroke-width: 1.6; marker-end: url(#ah); }
    .node { fill: var(--air); } .end { fill: var(--box); stroke: var(--air); stroke-width: 2; }
    .ca { fill: var(--air); } .cz { fill: var(--zig); } .cw { fill: var(--wire); } .cq { fill: var(--quiet); }
  </style>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="var(--ink)"/></marker></defs>
  <rect width="1120" height="392" rx="18" fill="var(--bg)"/>
  <rect class="box b-air" x="30" y="70" width="250" height="84" rx="12"/>
  <text class="t1" x="46" y="108.0" text-anchor="start">ESP32-C6</text>
  <text class="t2" x="46" y="128.0" text-anchor="start">built in, on SPI</text>
  <rect class="box b-zig" x="30" y="226" width="250" height="84" rx="12"/>
  <text class="t1" x="46" y="264.0" text-anchor="start">USB radio dongle</text>
  <text class="t2" x="46" y="284.0" text-anchor="start">firmware detected at plug-in</text>
  <line class="air" x1="280" y1="112" x2="410" y2="160"/>
  <line class="zigl" x1="280" y1="268" x2="410" y2="220"/>
  <rect class="pcb" x="410" y="90" width="260" height="200" rx="22"/>
  <text class="t1" x="540" y="148" text-anchor="middle" style="fill:#e7ecef;font-size:19px">ESP32-P4</text>
  <text class="t2" x="540" y="172" text-anchor="middle" style="fill:#a9c3c6">a mode per radio</text>
  <rect x="432" y="196" width="72" height="28" rx="14" fill="var(--pcb)" stroke="var(--air)"/>
  <text class="t3 ca" x="468.0" y="215" text-anchor="middle">Thread</text>
  <rect x="510" y="196" width="72" height="28" rx="14" fill="var(--pcb)" stroke="var(--zig)"/>
  <text class="t3 cz" x="546.0" y="215" text-anchor="middle">Zigbee</text>
  <rect x="588" y="196" width="62" height="28" rx="14" fill="var(--pcb)" stroke="var(--wire)"/>
  <text class="t3 cw" x="619.0" y="215" text-anchor="middle">Proxy</text>
  <text class="t2" x="540" y="256" text-anchor="middle" style="fill:#a9c3c6">or off</text>
  <path class="wire" d="M670 190 C 740 190, 740 70, 800 70"/>
  <path class="wire" d="M670 190 C 740 190, 740 190, 800 190"/>
  <path class="wire" d="M670 190 C 740 190, 740 310, 800 310"/>
  <rect class="box b-air" x="800" y="40" width="290" height="62" rx="12"/>
  <text class="t1" x="816" y="67.0" text-anchor="start">Home Assistant</text>
  <text class="t2" x="816" y="87.0" text-anchor="start">OpenThread Border Router integration</text>
  <rect class="box b-air" x="800" y="159" width="290" height="62" rx="12"/>
  <text class="t1" x="816" y="186.0" text-anchor="start">Matter controllers</text>
  <text class="t2" x="816" y="206.0" text-anchor="start">reach Thread devices through it</text>
  <rect class="box b-zig" x="800" y="279" width="290" height="62" rx="12"/>
  <text class="t1" x="816" y="306.0" text-anchor="start">ZHA or Zigbee2MQTT</text>
  <text class="t2" x="816" y="326.0" text-anchor="start">ZHA on board · Z2M through the proxy</text>
  <text class="t2" x="550" y="372" text-anchor="middle">Thread and the on-board Zigbee coordinator run one at a time; a proxy runs beside either.</text>
</svg>
