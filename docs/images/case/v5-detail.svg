<text x="60.0" y="340.0" font-family="sans-serif" font-size="12" fill="#111" text-anchor="start" font-weight="normal">Opening: lever the lid up through the grille with a small flat screwdriver; pry cut-outs are left for a later revision.</text>
<text x="60.0" y="362.0" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">Board, cable end, header end, keyholes and the SMA are as in v4.</text></svg>