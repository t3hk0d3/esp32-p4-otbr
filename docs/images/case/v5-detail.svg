<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="400" viewBox="0 0 1180 400"><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,2 L5,5 L0,8" fill="none" stroke="#db2777"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="60.0" y="32.0" font-family="sans-serif" font-size="18" fill="#111" text-anchor="start" font-weight="bold">ESP32-P4 case — sketch v5 (how the lid holds and comes off)</text>
