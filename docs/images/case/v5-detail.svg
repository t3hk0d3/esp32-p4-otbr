<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="400" viewBox="0 0 1180 400"><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,2 L5,5 L0,8" fill="none" stroke="#db2777"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="60.0" y="32.0" font-family="sans-serif" font-size="18" fill="#111" text-anchor="start" font-weight="bold">ESP32-P4 case — sketch v5 (how the lid holds and comes off)</text>
<text x="60.0" y="54.0" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">Honeycomb grille: holes ≤ 3.5 mm, 1 mm walls, 5.5 mm solid frame (the tabs hang from the frame).</text>
<text x="60.0" y="100.0" font-family="sans-serif" font-size="15" fill="#111" text-anchor="start" font-weight="bold">E. Section across the case through two corner tabs</text>
<rect x="120.0" y="270.5" width="300.0" height="10.0" rx="0" fill="#d1d5db" fill-opacity="1" stroke="#374151" stroke-width="1.5"/>
<rect x="120.0" y="145.0" width="10.0" height="125.5" rx="0" fill="#d1d5db" fill-opacity="1" stroke="#374151" stroke-width="1.5"/>
<rect x="410.0" y="145.0" width="10.0" height="125.5" rx="0" fill="#d1d5db" fill-opacity="1" stroke="#374151" stroke-width="1.5"/>
<rect x="125.0" y="145.0" width="290.0" height="10.0" rx="0" fill="#a5b4fc" fill-opacity="1" stroke="#374151" stroke-width="1.5"/>
<polygon points="130.0,155.0 142.0,155.0 139.5,172.5 132.5,172.5 130.0,165.0" fill="#a5b4fc" stroke="#374151" stroke-width="1"/>
<polygon points="410.0,155.0 398.0,155.0 400.5,172.5 407.5,172.5 410.0,165.0" fill="#a5b4fc" stroke="#374151" stroke-width="1"/>
<rect x="132.5" y="237.5" width="275.0" height="8.0" rx="0" fill="#16a34a" fill-opacity="0.5" stroke="#16a34a" stroke-width="1.5"/>
<rect x="154.0" y="157.5" width="78.0" height="80.0" rx="0" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="1"/>
<text x="192.5" y="197.5" font-family="sans-serif" font-size="10" fill="#111" text-anchor="middle" font-weight="normal">USB</text>
<rect x="367.5" y="202.5" width="35.0" height="35.0" rx="0" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="1"/>
<text x="385.0" y="222.5" font-family="sans-serif" font-size="9" fill="#111" text-anchor="middle" font-weight="normal">caps</text>
<text x="312.5" y="177.5" font-family="sans-serif" font-size="10" fill="#111" text-anchor="middle" font-weight="normal">tab tip ≈ 13.5 mm above the board:</text>
<text x="312.5" y="188.5" font-family="sans-serif" font-size="10" fill="#111" text-anchor="middle" font-weight="normal">clears USB, buttons, caps, ribbon plug</text>
<text x="520.0" y="100.0" font-family="sans-serif" font-size="15" fill="#111" text-anchor="start" font-weight="bold">F. Tab close-up (in the wall's inner face)</text>
<rect x="500.0" y="180.0" width="30.0" height="135.0" rx="0" fill="#d1d5db" fill-opacity="1" stroke="#374151" stroke-width="1.5"/>
<rect x="530.0" y="180.0" width="120.0" height="15.0" rx="0" fill="#a5b4fc" fill-opacity="1" stroke="#374151" stroke-width="1.5"/>
<rect x="515.0" y="165.0" width="135.0" height="15.0" rx="0" fill="#a5b4fc" fill-opacity="1" stroke="#374151" stroke-width="1.5"/>
<polygon points="530.0,195.0 566.0,195.0 558.5,247.5 537.5,247.5 530.0,225.0" fill="#a5b4fc" stroke="#374151" stroke-width="1"/>
<text x="567.5" y="234.0" font-family="sans-serif" font-size="11" fill="#111" text-anchor="start" font-weight="normal">wedge both sides: 2.4 mm root, 1.4 mm tip</text>
<polygon points="530.0,217.5 522.5,210.0 530.0,202.5" fill="#a5b4fc" stroke="#374151" stroke-width="1"/>
<text x="567.5" y="258.0" font-family="sans-serif" font-size="11" fill="#111" text-anchor="start" font-weight="normal">shallow detent bump (30° ramps), 1.5 mm root fillet</text>
<text x="567.5" y="276.0" font-family="sans-serif" font-size="11" fill="#111" text-anchor="start" font-weight="normal">outer lead-in below it: tip glides off the wall</text>
<text x="567.5" y="204.0" font-family="sans-serif" font-size="11" fill="#111" text-anchor="start" font-weight="normal">lid frame sits in a 1 mm rebate</text>
<text x="477.5" y="327.0" font-family="sans-serif" font-size="11" fill="#111" text-anchor="start" font-weight="normal">wall</text>
<text x="900.0" y="100.0" font-family="sans-serif" font-size="15" fill="#111" text-anchor="start" font-weight="bold">G. Tab from the side</text>
<rect x="900.0" y="140.0" width="30.0" height="150.0" rx="0" fill="#d1d5db" fill-opacity="1" stroke="#374151" stroke-width="1.5"/>
<polygon points="933.0,155.0 1095.0,155.0 1095.0,207.5 940.5,207.5 933.0,185.0" fill="#a5b4fc" stroke="#374151" stroke-width="1"/>
<text x="900.0" y="312.5" font-family="sans-serif" font-size="11" fill="#111" text-anchor="start" font-weight="normal">cable wall</text>
<text x="960.0" y="282.5" font-family="sans-serif" font-size="11" fill="#111" text-anchor="start" font-weight="normal">same lead-in toward the end wall:</text>
<text x="960.0" y="300.5" font-family="sans-serif" font-size="11" fill="#111" text-anchor="start" font-weight="normal">the tip narrows both ways</text>
<text x="60.0" y="340.0" font-family="sans-serif" font-size="12" fill="#111" text-anchor="start" font-weight="normal">Opening: lever the lid up through the grille with a small flat screwdriver; pry cut-outs are left for a later revision.</text>
<text x="60.0" y="362.0" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">Board, cable end, header end, keyholes and the SMA are as in v4.</text></svg>