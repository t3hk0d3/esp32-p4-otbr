  <circle class="end" cx="814.5" cy="87.0" r="5"/>
  <line class="air" x1="877.5" y1="145.5" x2="850.5" y2="172.5" opacity="0.7"/>
  <circle class="end" cx="877.5" cy="145.5" r="5"/>
  <line class="air" x1="769.5" y1="204.0" x2="801.0" y2="177.0" opacity="0.7"/>
  <circle class="end" cx="769.5" cy="204.0" r="5"/>
  <line class="air" x1="864.0" y1="204.0" x2="850.5" y2="172.5" opacity="0.7"/>
  <circle class="end" cx="864.0" cy="204.0" r="5"/>
  <circle class="node" cx="774.0" cy="123.0" r="8"/>
  <circle class="node" cx="841.5" cy="115.8" r="8"/>
  <circle class="node" cx="801.0" cy="177.0" r="8"/>
  <circle class="node" cx="850.5" cy="172.5" r="8"/>
  <text class="t3" x="40" y="262" text-anchor="start">Upstairs devices</text>
  <text class="t3" x="920" y="262" text-anchor="end">Downstairs devices</text>
  <line class="air" x1="178" y1="234" x2="190" y2="184"/>
  <line class="air" x1="668" y1="234" x2="800" y2="184"/>
