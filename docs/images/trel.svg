  <text class="t1" x="235.0" y="312.0" text-anchor="middle" style="fill:#e7ecef">Board 1</text>
  <rect class="pcb" x="650" y="270" width="150" height="74" rx="12"/>
  <rect x="664" y="236" width="8" height="40" rx="4" fill="var(--quiet)"/>
  <text class="t1" x="725.0" y="312.0" text-anchor="middle" style="fill:#e7ecef">Board 2</text>
  <path class="wire" d="M310 320 H420"/>
  <path class="wire" d="M650 320 H540"/>
  <rect class="box b-wire" x="420" y="290" width="120" height="60" rx="12"/>
  <text class="t1" x="480.0" y="325.0" text-anchor="middle">Switch</text>
  <path d="M235 344 C 300 420, 660 420, 725 344" fill="none" stroke="#8a5cd0" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="t3" x="480" y="425" text-anchor="middle">TREL: Thread links over Ethernet</text>
  <text class="t2" x="480" y="444" text-anchor="middle">one Thread network, though the radios can't hear each other</text>
</svg>
