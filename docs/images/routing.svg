<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 330" width="1110" height="330" role="img"
     aria-label="Routing to the mesh: Thread devices use the OMR prefix 2001:db8:42:100::/64. The board announces it to your router over BGP or RIPng, so hosts on other subnets reach the Thread devices through the board. With DHCPv6 prefix delegation the router knows the prefix already.">
  <!-- Generated for the documentation. Teal is radio (Thread), yellow Zigbee, copper wire. -->
  <style>
    :root { --bg: #eef2f4; --box: #ffffff; --line: #c3ced6; --ink: #17222c; --quiet: #5d6b77;
            --air: #12968f; --zig: #a8850f; --wire: #b8732e; --pcb: #0e3b43; --silk: #e9e4d4; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1a24; --box: #16242f; --line: #2d3d4a; --ink: #e7ecef; --quiet: #91a0ab;
              --air: #3cc7bb; --zig: #e6c84f; --wire: #d9944a; --pcb: #0b2c33; --silk: #e9e4d4; }
    }
    text { font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
    .t1 { font-size: 16px; font-weight: 650; }
    .t2 { font-size: 13px; fill: var(--quiet); }
    .t3 { font-size: 12.5px; font-weight: 600; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .silk { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: var(--silk); }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.5; }
    .box.b-air { stroke: var(--air); } .box.b-zig { stroke: var(--zig); } .box.b-wire { stroke: var(--wire); }
    .pcb { fill: var(--pcb); stroke: var(--air); stroke-width: 1.5; }
    .chip { fill: #c9ced2; stroke: #8e979f; stroke-width: 1; }
    .wire { fill: none; stroke: var(--wire); stroke-width: 3; stroke-linecap: round; }
    .wire.thin { stroke-width: 2; }
    .air { fill: none; stroke: var(--air); stroke-width: 1.8; stroke-dasharray: 5 6; stroke-linecap: round; }
    .airs { fill: none; stroke: var(--air); stroke-width: 1.8; stroke-linecap: round; }
    .zigl { fill: none; stroke: var(--zig); stroke-width: 1.8; stroke-dasharray: 5 6; stroke-linecap: round; }
    .lead { fill: none; stroke: var(--quiet); stroke-width: 1; }
    .arrow { fill: none; stroke: var(--ink); stroke-width: 1.6; marker-end: url(#ah); }
    .node { fill: var(--air); } .end { fill: var(--box); stroke: var(--air); stroke-width: 2; }
    .ca { fill: var(--air); } .cz { fill: var(--zig); } .cw { fill: var(--wire); } .cq { fill: var(--quiet); }
  </style>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="var(--ink)"/></marker></defs>
  <rect width="1110" height="330" rx="18" fill="var(--bg)"/>
  <line class="airs" x1="90.0" y1="140.0" x2="165.0" y2="132.0" opacity="0.7"/>
  <line class="airs" x1="90.0" y1="140.0" x2="120.0" y2="200.0" opacity="0.7"/>
  <line class="airs" x1="165.0" y1="132.0" x2="175.0" y2="195.0" opacity="0.7"/>
  <line class="airs" x1="120.0" y1="200.0" x2="175.0" y2="195.0" opacity="0.7"/>
  <line class="airs" x1="165.0" y1="132.0" x2="120.0" y2="200.0" opacity="0.7"/>
  <line class="air" x1="55.0" y1="160.0" x2="90.0" y2="140.0" opacity="0.7"/>
  <circle class="end" cx="55.0" cy="160.0" r="5"/>
  <line class="air" x1="135.0" y1="100.0" x2="165.0" y2="132.0" opacity="0.7"/>
  <circle class="end" cx="135.0" cy="100.0" r="5"/>
  <line class="air" x1="205.0" y1="165.0" x2="175.0" y2="195.0" opacity="0.7"/>
  <circle class="end" cx="205.0" cy="165.0" r="5"/>
  <line class="air" x1="85.0" y1="230.0" x2="120.0" y2="200.0" opacity="0.7"/>
  <circle class="end" cx="85.0" cy="230.0" r="5"/>
  <line class="air" x1="190.0" y1="230.0" x2="175.0" y2="195.0" opacity="0.7"/>
  <circle class="end" cx="190.0" cy="230.0" r="5"/>
  <circle class="node" cx="90.0" cy="140.0" r="8"/>
  <circle class="node" cx="165.0" cy="132.0" r="8"/>
  <circle class="node" cx="120.0" cy="200.0" r="8"/>
  <circle class="node" cx="175.0" cy="195.0" r="8"/>
  <text class="t3" x="130" y="290" text-anchor="middle">Thread devices</text>
  <text class="mono" x="130" y="308" text-anchor="middle">2001:db8:42:100::/64</text>
  <line class="air" x1="210" y1="170" x2="280" y2="170"/>
  <rect class="pcb" x="280" y="128" width="170" height="84" rx="12"/>
  <rect x="294" y="94" width="8" height="40" rx="4" fill="var(--quiet)"/>
  <text class="t1" x="365.0" y="170.0" text-anchor="middle" style="fill:#e7ecef">This board</text>
  <text class="t2" x="365.0" y="190.0" text-anchor="middle" style="fill:#a9c3c6">border router</text>
  <path class="wire" d="M450 170 H640"/>
  <text class="t3" x="545" y="150" text-anchor="middle">BGP or RIPng:</text>
  <text class="mono" x="545" y="198" text-anchor="middle">"2001:db8:42:100::/64</text>
  <text class="mono" x="545" y="214" text-anchor="middle">is behind me"</text>
  <rect class="box b-wire" x="640" y="130" width="200" height="80" rx="12"/>
  <text class="t1" x="656" y="166.0" text-anchor="start">Your router</text>
  <text class="t2" x="656" y="186.0" text-anchor="start">learns the route</text>
  <path class="wire thin" d="M840 170 H900"/>
  <rect class="box " x="900" y="130" width="190" height="80" rx="12"/>
  <text class="t1" x="916" y="166.0" text-anchor="start">Other subnets</text>
  <text class="t2" x="916" y="186.0" text-anchor="start">VLANs, VPN, servers</text>
  <text class="t2" x="610" y="300" text-anchor="middle">With DHCPv6 prefix delegation the router already knows the prefix: nothing to announce.</text>
</svg>
