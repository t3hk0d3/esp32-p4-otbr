# Run with: uvx pre-commit run --all-files
exclude: ^tools/phase0/
repos:
  - repo: https://github.com/espressif/astyle_py.git
    rev: v1.0.5
    hooks:
      - id: astyle_py
        # Same astyle version as ESP-IDF v6.1; rules copied from its tools/ci/astyle-rules.yml.
        args: ['--astyle-version=3.4.7', '--rules=tools/astyle-rules.yml']
        # Vendored upstream code keeps its formatting.
        exclude: ^p4/components/(esp_ot_br_server|esp_br_http_ota|usb_host_cdc_acm)/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        exclude: ^p4/components/(esp_ot_br_server|esp_br_http_ota|usb_host_cdc_acm)/
      - id: ruff-format
        exclude: ^p4/components/(esp_ot_br_server|esp_br_http_ota|usb_host_cdc_acm)/
