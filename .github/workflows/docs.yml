# Documentation site on GitHub Pages: docs/ and README.md (mkdocs.yml) plus the browser flasher with the P4 images of
# the latest release. Built on pull requests (as a link check), published from master and after each release build.
name: docs

on:
  push:
    branches: [master]
    paths: [docs/**, README.md, mkdocs.yml, tools/docs_hooks.py, tools/flash_manifest.py, tools/targets.py, p4/targets/**, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, README.md, mkdocs.yml, tools/docs_hooks.py, tools/flash_manifest.py, tools/targets.py, p4/targets/**, .github/workflows/docs.yml]
  # build.yml publishes the release with the job token, which starts no `release` workflow; this runs on master instead
  workflow_run:
    workflows: [build]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # after build.yml: only for a successful v* tag build
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q mkdocs-material
      - name: Build the site
        run: make docs MKDOCS=mkdocs
      - name: Firmware of the latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: make docs-firmware
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
