# Host tests and release build on every push and pull request; a v* tag also publishes a GitHub release.
# A pull request that changes only documentation skips them (the jobs report as skipped, which passes a required check).
# No board is involved: target tests (p4/pytest) run on the bench only.
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  IDF_EXPORT: /opt/esp/idf/export.sh # the Makefile activates ESP-IDF from here

jobs:
  # Whether a pull request touches anything besides documentation. Pushes (master, tags) always build:
  # master runs keep the sizes artifact for the size reports, tag runs make the release.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo "firmware=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Documentation only: Markdown anywhere, docs/, the site config and its hook, the docs workflow.
          docs='^(docs/.*|.*\.md|mkdocs\.yml|tools/docs_hooks\.py|\.github/workflows/docs\.yml)$'
          other="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' | grep -Ev "$docs" || true)"
          if [[ -n "$other" ]]; then
            echo "firmware=true" >>"$GITHUB_OUTPUT"
            printf 'non-documentation changes:\n%s\n' "$other"
          else
            echo "firmware=false" >>"$GITHUB_OUTPUT"
            echo "documentation only: host tests and build skipped" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  host-tests:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1 # keep in step with IDF_VERSION
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4 # the device page tests run the page scripts under node
        with:
          node-version: 22
      - name: Component host tests
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make test-host
      - name: Tooling tests
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_EXPORT" >/dev/null && python3 -m pip install -q pytest requests prometheus_client # into the IDF Python environment
          make test-tools PYTEST="python3 -m pytest"

  build:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1 # keep in step with IDF_VERSION
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging and test tools
        run: |
          apt-get update -qq
          # clang++: the vendored REST tests read the OpenThread declarations from a clang AST dump
          apt-get install -y -qq zip clang >/dev/null
      - name: Build c6_updater, c6_rcp, c6_installer, p4
        run: |
          # version.cmake reads the git hash; the checkout belongs to another user than the container's root
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make build
      - name: Vendored REST host tests
        run: make test-vendored
      - name: Package
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/
          if-no-files-found: error
      - name: Image sizes
        run: make -s sizes SIZES=sizes/sizes.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sizes # master runs keep it as the base of the pull request size reports
          path: sizes/sizes.json
          if-no-files-found: error

  # Posts the image sizes and their change against master as a pull request comment, updated on every push.
  size-report:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read # the base sizes artifact of a master run
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sizes
          path: head
      - name: Base sizes from master
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The run of the PR's base commit, else the latest successful master run (the base commit's may be cancelled).
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch master --event push \
            --status success --limit 50 --json databaseId,headSha)"
          run="$(jq -r --arg sha "$BASE_SHA" '(map(select(.headSha == $sha)) + .)[0] | "\(.databaseId) \(.headSha)"' <<<"$runs")"
          read -r id sha <<<"$run"
          if [[ "$id" != null ]] && gh run download "$id" --repo "$GITHUB_REPOSITORY" --name sizes --dir base; then
            label="master @ ${sha:0:7}"
            [[ "$sha" == "$BASE_SHA" ]] || label+=" (the latest successful master build)"
            echo "label=$label" >>"$GITHUB_OUTPUT"
          else
            echo "no master build with a sizes artifact"
          fi
      - name: Report
        env:
          LABEL: ${{ steps.base.outputs.label }}
        run: |
          make -s sizes-report SIZES=head/sizes.json SIZES_BASE=base/sizes.json SIZES_BASE_LABEL="$LABEL" >report.md
          cat report.md >>"$GITHUB_STEP_SUMMARY"
      - name: Comment
        # A pull request from a fork gets a read-only token: the report stays in the job summary.
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- image-sizes -->"))) | .id' |
            head -n 1)"
          if [[ -n "$id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@report.md >/dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file report.md
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            # the CHANGELOG.md section of this tag (v0.1.0 -> "## [0.1.0]"), without its heading
            awk -v head="## [${TAG#v}]" 'index($0, head) == 1 {on = 1; next} on && /^## \[/ {exit} on && !/^\[/' CHANGELOG.md
            echo "## Versions"
            echo
            echo '```'
            cat dist/versions.txt
            echo '```'
            echo
            echo "## Files"
            echo
            echo "- \`otbr.bundle\`: P4 app and web UI, for an OTA update (Device > Firmware page or \`POST /device/ota\`)."
            echo "- \`c6_rcp.bin\`: C6 radio firmware from the same build (Device > Firmware page or \`POST /device/radio/firmware\`)."
            echo "- \`c6_installer.bin\`: one-time first install on a factory C6 (ESP-Hosted): upload it like the radio firmware, then \`c6_rcp.bin\` (see docs/first-install.md)."
            echo "- \`p4-flash.zip\`: full P4 flash over USB: \`esptool --chip esp32p4 write-flash @flash_args\` inside the unpacked directory."
            echo "- \`c6-updater-flash.zip\`: C6 base images for the no-jumper first install (see docs/first-install.md)."
            echo "- \`third-party-licenses.zip\`: license texts of the code linked into the images."
            echo "- \`SHA256SUMS\`: checksums of the files above."
          } >notes.md
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag
