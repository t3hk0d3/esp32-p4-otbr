# Host tests and release build on every push and pull request; a v* tag also publishes a GitHub release.
# No board is involved: target tests (p4/pytest) run on the bench only.
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  IDF_EXPORT: /opt/esp/idf/export.sh # the Makefile activates ESP-IDF from here

jobs:
  host-tests:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1 # keep in step with IDF_VERSION
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4 # the device page tests run the page scripts under node
        with:
          node-version: 22
      - name: Component host tests
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make test-host
      - name: Tooling tests
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_EXPORT" >/dev/null && python3 -m pip install -q pytest requests prometheus_client # into the IDF Python environment
          make test-tools PYTEST="python3 -m pytest"

  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1 # keep in step with IDF_VERSION
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging and test tools
        run: |
          apt-get update -qq
          # clang++: the vendored REST tests read the OpenThread declarations from a clang AST dump
          apt-get install -y -qq zip clang >/dev/null
      - name: Build c6_updater, c6_rcp, c6_installer, p4
        run: |
          # version.cmake reads the git hash; the checkout belongs to another user than the container's root
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make build
      - name: Vendored REST host tests
        run: make test-vendored
      - name: Package
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            # the CHANGELOG.md section of this tag (v0.1.0 -> "## [0.1.0]"), without its heading
            awk -v head="## [${TAG#v}]" 'index($0, head) == 1 {on = 1; next} on && /^## \[/ {exit} on && !/^\[/' CHANGELOG.md
            echo "## Versions"
            echo
            echo '```'
            cat dist/versions.txt
            echo '```'
            echo
            echo "## Files"
            echo
            echo "- \`otbr.bundle\`: P4 app and web UI, for an OTA update (Device > Firmware page or \`POST /device/ota\`)."
            echo "- \`c6_rcp.bin\`: C6 radio firmware from the same build (Device > Firmware page or \`POST /device/radio/firmware\`)."
            echo "- \`c6_installer.bin\`: one-time first install on a factory C6 (ESP-Hosted): upload it like the radio firmware, then \`c6_rcp.bin\` (see docs/first-install.md)."
            echo "- \`p4-flash.zip\`: full P4 flash over USB: \`esptool --chip esp32p4 write-flash @flash_args\` inside the unpacked directory."
            echo "- \`c6-updater-flash.zip\`: C6 base images for the no-jumper first install (see docs/first-install.md)."
            echo "- \`third-party-licenses.zip\`: license texts of the code linked into the images."
            echo "- \`SHA256SUMS\`: checksums of the files above."
          } >notes.md
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag
