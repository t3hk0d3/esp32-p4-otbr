dependencies:
  # The USB host stack and the three serial drivers of the USB transport, at the versions already locked through
  # esp-serial-flasher (its private dependency is not relied on). Target only: the host tests cover the pure core.
  espressif/usb:
    version: "==1.6.0"
    rules:
      - if: "target != linux"
  # Vendored (p4/components/usb_host_cdc_acm, 2.4.1 plus the patches in p4/components/PATCHES.md); override_path makes
  # every user of the component (the CH34x and CP210x drivers, esp-serial-flasher) build this copy.
  espressif/usb_host_cdc_acm:
    override_path: "../usb_host_cdc_acm"
    rules:
      - if: "target != linux"
  espressif/usb_host_cp210x_vcp:
    version: "==2.2.0"
    rules:
      - if: "target != linux"
  espressif/usb_host_ch34x_vcp:
    version: "==2.2.1"
    rules:
      - if: "target != linux"
