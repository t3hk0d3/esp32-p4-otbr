[pytest]
# Target tests run against the test build (tools/build_all.sh --test) flashed to the board in $P4_PORT.
# Tests that need a person at the board are excluded unless selected: pytest -s -m manual_cable
addopts = --embedded-services esp,idf --target esp32p4 -m "not manual_cable and not no_jumper and not vlan_switch and not pd_router and not routing_rig"
markers =
    manual_cable: needs a person to unplug and replug the Ethernet cable (run with -s)
    jumper: needs the maintenance jumper fitted (the default rig)
    no_jumper: needs the maintenance jumper removed (re-wire; run with -m no_jumper)
    vlan_switch: needs the managed switch with a trunk to the board and VLAN hosts (env VLAN_MGMT, VLAN_THREAD, HOST_IF_MGMT, HOST_IF_THREAD; run with -m vlan_switch)
    pd_router: DHCPv6-PD against a delegating server in a Docker container on the LAN (env PD_HOST_IF; run with -m pd_router)
    routing_rig: mesh routing against FRR and BIRD containers on the LAN (env ROUTING_HOST_IF; run with -m routing_rig)
